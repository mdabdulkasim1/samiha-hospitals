<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 210 210" role="img"
     aria-label="No logo uploaded yet">
  <!--
    A placeholder, and it says so.

    An earlier version of this file was a drawn approximation of the company's
    own mark. It is not the company's mark, and a system that quietly prints an
    approximation of somebody's logo on their invoices is worse than one that
    prints none. So this is plain type: obviously a stand-in, until the real
    artwork is uploaded under Masters -> Logo.
  -->
  <rect width="210" height="210" rx="34" fill="#0E3A5C"/>
  <text x="105" y="118" text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif" font-size="62" font-weight="700"
        letter-spacing="2" fill="#FFFFFF">AKR</text>
  <text x="105" y="150" text-anchor="middle"
        font-family="Helvetica, Arial, sans-serif" font-size="15" letter-spacing="1.6"
        fill="#7FD3A4">LOGO NOT SET</text>
</svg>
