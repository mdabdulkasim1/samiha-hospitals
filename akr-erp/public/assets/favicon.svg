<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 210 210" role="img" aria-label="AKR">
  <defs>
    <linearGradient id="akrPlume" x1="0.12" y1="0.02" x2="0.86" y2="0.98">
      <stop offset="0"    stop-color="#1E6E8C"/>
      <stop offset="0.24" stop-color="#22829B"/>
      <stop offset="0.48" stop-color="#3E9E58"/>
      <stop offset="0.68" stop-color="#6FBA45"/>
      <stop offset="0.86" stop-color="#C9A521"/>
      <stop offset="1"    stop-color="#E0A21E"/>
    </linearGradient>
    <linearGradient id="akrSweepA" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#16607E"/><stop offset="1" stop-color="#3E9E58" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="akrSweepB" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#7FC24A"/><stop offset="1" stop-color="#E0A21E"/>
    </linearGradient>
    <linearGradient id="akrBeak" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F8C93F"/><stop offset="1" stop-color="#E08C0C"/>
    </linearGradient>
  </defs>
  <!-- The head. Petrol blue at the crown, through green, to gold at the breast. -->
  <path d="M96 10c46 0 82 34 82 78 0 24-9 45-25 61-13 13-21 27-24 43-3 14-15 22-29 19
           C58 203 22 160 18 108 12 50 46 10 96 10Z" fill="url(#akrPlume)"/>

  <!-- Feather sweeps: the bands that stop it reading as a flat blob. -->
  <path d="M96 10c-30 0-54 16-66 40 6 40 26 72 58 94-18-34-22-68-12-102 6-20 16-31 30-32Z"
        fill="url(#akrSweepA)" opacity=".55"/>
  <path d="M40 132c14 32 38 56 72 70-4-12-12-22-24-30-22-14-38-28-48-40Z"
        fill="url(#akrSweepB)" opacity=".45"/>
  <g fill="none" stroke="#0E5570" stroke-opacity=".30" stroke-width="4" stroke-linecap="round">
    <path d="M50 60c10-18 26-29 45-32"/>
    <path d="M36 92c3-22 13-40 30-51"/>
  </g>
  <g fill="none" stroke="#2A7A33" stroke-opacity=".26" stroke-width="4" stroke-linecap="round">
    <path d="M34 128c-4-19 0-36 9-50"/>
    <path d="M58 162c-9-17-11-35-6-52"/>
  </g>

  <!-- The neck: the navy crescent that turns a coloured shape into this bird. -->
  <path d="M126 62c26 6 44 24 50 48 6 27-4 54-27 70-12 8-25 12-37 11 24-14 38-36 38-63
           0-25-12-46-33-58 2-5 5-8 9-8Z" fill="#123A5C"/>
  <path d="M139 88c11 11 17 25 17 41 0 19-8 35-23 46 6-14 9-28 9-42 0-16-1-31-3-45Z"
        fill="#1B7A4B" opacity=".9"/>

  <!-- The eye patch, angular, running into the base of the beak. -->
  <path d="M104 34c18-6 38-3 50 9 5 5 4 11-3 14-16 7-35 6-49-4-7-5-6-16 2-19Z" fill="#123A5C"/>
  <!-- The eye. -->
  <circle cx="128" cy="41" r="10" fill="#F4F7FA"/>
  <circle cx="128" cy="41" r="6.6" fill="#D51F26"/>
  <circle cx="130" cy="38.5" r="2.2" fill="#fff" fill-opacity=".9"/>

  <!-- The beak: hooked, and the loudest thing on the mark. -->
  <path d="M150 40c22 2 39 12 50 28-16 1-29 7-38 17-7 8-17 13-29 14 11-10 17-21 17-33
           0-9-3-17-9-24 2-2 5-3 9-2Z" fill="url(#akrBeak)"/>
  <path d="M162 99c-9 6-19 9-31 10 14-2 26-7 36-15-1 2-3 4-5 5Z" fill="#B26F09" fill-opacity=".55"/>
  <path d="M150 40c22 2 39 12 50 28-18-10-38-15-60-15 2-5 5-10 10-13Z" fill="#F8D36B" fill-opacity=".5"/>
</svg>
