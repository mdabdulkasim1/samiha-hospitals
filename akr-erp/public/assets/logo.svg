<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 560" role="img"
     aria-label="AKR General Trading LLC">
  <!--
    The lock-up: the mark above the wordmark, for the sign-in page.

    The company's own artwork sets this type in white, on a dark ground. Here it
    is dark green, because the plate behind a logo in this system is white by
    default and white type on white is nothing at all. Upload the real file - or
    set COMPANY_LOGO_URL / COMPANY_LOGO_DATA on the service - and this is
    replaced whole. See Masters -> Logo.
  -->
  <defs>
    <linearGradient id="akrDiscF" x1="0.55" y1="0" x2="0.2" y2="1">
      <stop offset="0" stop-color="#2F72AC"/>
      <stop offset="0.3" stop-color="#2A9C8B"/>
      <stop offset="0.58" stop-color="#4FB44D"/>
      <stop offset="1" stop-color="#EBC53A"/>
    </linearGradient>
    <linearGradient id="akrBandF" x1="0.2" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#6FC07A"/>
      <stop offset="0.55" stop-color="#8FCB57"/>
      <stop offset="1" stop-color="#D9C63F"/>
    </linearGradient>
    <linearGradient id="akrHeadF" x1="0.35" y1="0" x2="0.55" y2="1">
      <stop offset="0" stop-color="#0B3E2D"/>
      <stop offset="0.5" stop-color="#12563C"/>
      <stop offset="1" stop-color="#237A4E"/>
    </linearGradient>
    <linearGradient id="akrBillF" x1="0" y1="0" x2="0.8" y2="0.85">
      <stop offset="0" stop-color="#F8D247"/>
      <stop offset="1" stop-color="#DC9E17"/>
    </linearGradient>
  </defs>

  <g transform="translate(42,18) scale(1.1) translate(-30,-30)">
