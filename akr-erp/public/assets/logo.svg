  <text x="230" y="478" text-anchor="middle" font-family="Helvetica, Arial, sans-serif"
        font-size="120" font-weight="700" letter-spacing="1" fill="#0B3E2D">AKR</text>
  <text x="230" y="530" text-anchor="middle" font-family="Helvetica, Arial, sans-serif"
